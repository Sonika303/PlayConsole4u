<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard · PlayConsole4u</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#07070f;color:#f0f0ff;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:900;letter-spacing:3px;color:#a78bfa;text-decoration:none}
.logo-box{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:14px}
.topbar-right{display:flex;align-items:center;gap:12px}
.back-lnk{font-size:10px;font-weight:800;letter-spacing:2px;color:rgba(167,139,250,.4);text-decoration:none;transition:.2s}
.back-lnk:hover{color:#a78bfa}
#signin-strip{display:none;background:rgba(124,58,237,.12);border-bottom:1px solid rgba(167,139,250,.15);padding:10px 28px;font-size:12px;font-weight:700;color:#a78bfa;align-items:center;justify-content:space-between;gap:12px}
#signin-strip button{background:#7c3aed;color:#fff;border:none;padding:7px 16px;border-radius:8px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}
#signin-strip button:hover{background:#6d28d9}
#signin-strip button img{width:14px;height:14px}
.page{max-width:820px;margin:0 auto;padding:32px 20px 80px}
.pg-label{font-size:10px;font-weight:800;letter-spacing:4px;color:#a78bfa;opacity:.6;text-transform:uppercase;margin-bottom:8px}
h1{font-size:32px;font-weight:900;margin-bottom:5px}
.pg-sub{font-size:12px;color:#7777aa;margin-bottom:28px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.tab{padding:6px 13px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.5px;border:1.5px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.35);cursor:pointer;font-family:'Nunito',sans-serif;transition:.15s}
.tab:hover{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.7)}
.tab.active{color:#fff;border-color:var(--ac,#a78bfa);background:color-mix(in srgb,var(--ac,#7c3aed) 18%,transparent)}
.lb-box{background:#0f0f1c;border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;margin-bottom:20px;min-height:120px}
.lb-head{display:grid;grid-template-columns:52px 1fr 110px 90px;padding:11px 18px;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.07);font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.28)}
.lb-row{display:grid;grid-template-columns:52px 1fr 110px 90px;padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center;transition:background .12s}
.lb-row:last-child{border-bottom:none}
.lb-row:hover{background:rgba(255,255,255,.025)}
.lb-row.me{background:color-mix(in srgb,var(--ac,#7c3aed) 12%,transparent)!important;border-left:3px solid var(--ac,#a78bfa)}
.rank{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:rgba(255,255,255,.22);text-align:center}
.rank.g{color:#f59e0b;font-size:17px}.rank.s{color:#94a3b8;font-size:17px}.rank.b{color:#b45309;font-size:17px}
.player{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);flex-shrink:0;border:1.5px solid rgba(255,255,255,.1);object-fit:cover}
.pname{font-size:13px;font-weight:800;color:#f0f0ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.you{font-size:8px;font-weight:800;letter-spacing:1px;background:var(--ac,#7c3aed);color:#fff;padding:2px 5px;border-radius:4px;margin-left:6px;flex-shrink:0}
.tcell{font-family:'Space Mono',monospace;font-size:12px;color:var(--ac,#a78bfa);text-align:right;font-weight:700}
.dcell{font-size:9px;color:rgba(255,255,255,.22);text-align:right}
.lb-state{padding:52px;text-align:center;color:rgba(255,255,255,.25);font-size:12px;font-weight:700;letter-spacing:2px}
.lb-state.spin::after{content:'';display:inline-block;width:14px;height:14px;border:2px solid rgba(167,139,250,.3);border-top-color:#a78bfa;border-radius:50%;animation:sp .7s linear infinite;margin-left:10px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.err-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:14px 18px;font-size:12px;font-weight:700;color:#fca5a5;margin-bottom:16px;display:none}
.pag{display:flex;align-items:center;justify-content:center;gap:8px}
.pg-btn{padding:7px 16px;border-radius:8px;border:1.5px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.4);font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;cursor:pointer;transition:.15s}
.pg-btn:hover:not(:disabled){border-color:rgba(255,255,255,.25);color:#f0f0ff}
.pg-btn:disabled{opacity:.18;cursor:not-allowed}
.pg-info{font-size:11px;font-weight:700;color:rgba(255,255,255,.28);padding:0 6px}
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="index.html"><div class="logo-box">🎮</div>PLAYCONSOLE4U</a>
  <div class="topbar-right"><a class="back-lnk" href="index.html">← HOME</a></div>
</div>

<div id="signin-strip">
  <span>Sign in to see your row highlighted and submit your times</span>
  <button onclick="doSignIn()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
    Sign in with Google
  </button>
</div>

<div class="page">
  <div class="pg-label">// Leaderboard</div>
  <h1>🏆 Top Times</h1>
  <p class="pg-sub">Best completion times per level — live from Firebase.</p>
  <div class="err-box" id="err-box"></div>
  <div class="tabs" id="tabs"></div>
  <div class="lb-box" id="lb-box"><div class="lb-state spin">LOADING</div></div>
  <div class="pag" id="pag"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script>
const ACCENTS = {1:'#f97316',2:'#22c55e',3:'#f43f5e',4:'#06b6d4',5:'#a855f7',6:'#eab308',7:'#38bdf8',8:'#f97316',9:'#84cc16',10:'#818cf8'};
const PER = 10;
let currentLvl = 1, rows = [], page = 1, currentUid = null, authReady = false;

function setAc(ac) { document.documentElement.style.setProperty('--ac', ac); }
function fmt(s) { if (s == null) return '—'; return s < 60 ? s.toFixed(3)+'s' : `${Math.floor(s/60)}m ${(s%60).toFixed(3)}s`; }
function fmtDate(ts) { if (!ts) return ''; return new Date(ts).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'2-digit' }); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function rankHtml(i) { if (i===0) return '<div class="rank g">🥇</div>'; if (i===1) return '<div class="rank s">🥈</div>'; if (i===2) return '<div class="rank b">🥉</div>'; return `<div class="rank">#${i+1}</div>`; }

function buildTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const b = document.createElement('button');
    b.className = 'tab' + (i === currentLvl ? ' active' : '');
    b.textContent = String(i);
    b.onclick = () => loadLevel(i);
    el.appendChild(b);
  }
}

function renderPag() {
  const total = Math.ceil(rows.length / PER);
  const el = document.getElementById('pag');
  if (total <= 1) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <button class="pg-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>← Prev</button>
    <span class="pg-info">Page ${page} / ${total} · ${rows.length} players</span>
    <button class="pg-btn" onclick="goPage(${page+1})" ${page===total?'disabled':''}>Next →</button>`;
}

function goPage(p) {
  const total = Math.ceil(rows.length / PER);
  if (p < 1 || p > total) return;
  page = p;
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPage() {
  const box = document.getElementById('lb-box');
  if (!rows.length) {
    box.innerHTML = '<div class="lb-state">No times yet for this level. Be the first!</div>';
    document.getElementById('pag').innerHTML = '';
    return;
  }
  const start = (page - 1) * PER;
  const slice = rows.slice(start, start + PER);
  let html = `<div class="lb-head">
    <div>Rank</div><div>Player</div>
    <div style="text-align:right">Time</div>
    <div style="text-align:right">Date</div>
  </div>`;
  slice.forEach((r, idx) => {
    const gi = start + idx;
    const isMe = r.uid === currentUid;
    const av = r.photo ? `<img class="av" src="${esc(r.photo)}" onerror="this.style.display='none'" alt="">` : `<div class="av"></div>`;
    html += `<div class="lb-row${isMe ? ' me' : ''}">
      ${rankHtml(gi)}
      <div class="player">
        ${av}
        <span class="pname">${esc(r.name)}${isMe ? '<span class="you">YOU</span>' : ''}</span>
      </div>
      <div class="tcell">${fmt(r.t)}</div>
      <div class="dcell">${fmtDate(r.ts)}</div>
    </div>`;
  });
  box.innerHTML = html;
  renderPag();
}

function showErr(msg) { const e = document.getElementById('err-box'); e.textContent = msg; e.style.display = 'block'; }
function hideErr() { document.getElementById('err-box').style.display = 'none'; }

async function loadLevel(n) {
  if (!authReady) return;
  if (!currentUid) {
    document.getElementById('lb-box').innerHTML = '<div class="lb-state">Sign in to view the leaderboard.</div>';
    document.getElementById('pag').innerHTML = '';
    return;
  }
  currentLvl = n; page = 1;
  setAc(ACCENTS[n]);
  buildTabs(); hideErr();
  document.getElementById('lb-box').innerHTML = '<div class="lb-state spin">LOADING</div>';
  document.getElementById('pag').innerHTML = '';
  try {
    rows = await window.FB.getLeaderboard(n);
    renderPage();
  } catch (e) {
    console.error('[LB]', e.code, e.message);
    showErr('⚠ Failed to load: ' + e.message);
    document.getElementById('lb-box').innerHTML = '<div class="lb-state">Failed to load.</div>';
  }
}

async function doSignIn() {
  try { await window.FB.signInGoogle(); } catch (e) { console.error('[LB] signIn:', e); }
}

window.FB.onAuthChange(user => {
  authReady = true;
  currentUid = user ? user.uid : null;
  document.getElementById('signin-strip').style.display = user ? 'none' : 'flex';
  loadLevel(currentLvl);
});

setAc(ACCENTS[1]);
buildTabs();
</script>
</body>
</html>
