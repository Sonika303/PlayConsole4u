<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard · PlayConsole4u</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#07070f;color:#f0f0ff;min-height:100vh}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:900;letter-spacing:3px;color:#a78bfa;text-decoration:none}
.logo-box{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:14px}
.back-lnk{font-size:10px;font-weight:800;letter-spacing:2px;color:rgba(167,139,250,.4);text-decoration:none;transition:.2s}
.back-lnk:hover{color:#a78bfa}

/* PAGE */
.page{max-width:820px;margin:0 auto;padding:32px 20px 80px}
.pg-label{font-size:10px;font-weight:800;letter-spacing:4px;color:#a78bfa;opacity:.6;text-transform:uppercase;margin-bottom:8px}
h1{font-size:32px;font-weight:900;margin-bottom:5px}
.pg-sub{font-size:12px;color:#7777aa;margin-bottom:28px}

/* LEVEL TABS */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:24px}
.tab{
  padding:6px 13px;border-radius:99px;
  font-size:10px;font-weight:800;letter-spacing:.5px;
  border:1.5px solid rgba(255,255,255,.1);background:transparent;
  color:rgba(255,255,255,.35);cursor:pointer;font-family:'Nunito',sans-serif;transition:.18s;
}
.tab:hover{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.7)}
.tab.active{color:#fff;border-color:var(--ac,#a78bfa);background:color-mix(in srgb,var(--ac,#7c3aed) 20%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--ac,#7c3aed) 30%,transparent)}

/* TABLE */
.lb-box{background:#0f0f1c;border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;margin-bottom:20px;min-height:200px}
.lb-head{display:grid;grid-template-columns:52px 1fr 100px 88px;padding:11px 18px;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.07);font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.3)}
.lb-row{display:grid;grid-template-columns:52px 1fr 100px 88px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center;transition:background .12s}
.lb-row:last-child{border-bottom:none}
.lb-row:hover{background:rgba(255,255,255,.03)}
.lb-row.me{background:color-mix(in srgb,var(--ac,#7c3aed) 10%,transparent) !important;border-left:3px solid var(--ac,#a78bfa)}

/* RANK */
.rank{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:rgba(255,255,255,.25);text-align:center}
.rank.g{color:#f59e0b;font-size:16px}
.rank.s{color:#94a3b8;font-size:16px}
.rank.b{color:#b45309;font-size:16px}

/* PLAYER */
.player{display:flex;align-items:center;gap:10px}
.avatar{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);flex-shrink:0;border:1.5px solid rgba(255,255,255,.1);object-fit:cover}
.pname{font-size:13px;font-weight:800;color:#f0f0ff}
.you-tag{font-size:8px;font-weight:800;letter-spacing:1px;background:var(--ac,#7c3aed);color:#fff;padding:2px 5px;border-radius:4px;margin-left:6px}

/* TIME + DATE */
.tcell{font-family:'Space Mono',monospace;font-size:12px;color:var(--ac,#a78bfa);text-align:right;font-weight:700}
.dcell{font-size:9px;color:rgba(255,255,255,.25);text-align:right}

/* STATES */
.lb-state{padding:48px;text-align:center;color:rgba(255,255,255,.25);font-size:12px;font-weight:700;letter-spacing:2px}
.lb-state.loading{animation:blink 1.2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* PAGINATION */
.pag{display:flex;align-items:center;justify-content:center;gap:8px}
.pg-btn{padding:7px 16px;border-radius:8px;border:1.5px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.4);font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;cursor:pointer;transition:.18s}
.pg-btn:hover:not(:disabled){border-color:rgba(255,255,255,.25);color:#f0f0ff}
.pg-btn:disabled{opacity:.2;cursor:not-allowed}
.pg-info{font-size:11px;font-weight:700;color:rgba(255,255,255,.3);padding:0 6px}

/* AUTH NOTICE */
.auth-notice{background:rgba(124,58,237,.12);border:1.5px solid rgba(167,139,250,.2);border-radius:10px;padding:12px 16px;font-size:12px;font-weight:700;color:#a78bfa;margin-bottom:20px;display:none}
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="index.html"><div class="logo-box">🎮</div>PLAYCONSOLE4U</a>
  <a class="back-lnk" href="index.html">← BACK TO HOME</a>
</div>

<div class="page">
  <div class="pg-label">// Leaderboard</div>
  <h1>🏆 Top Times</h1>
  <p class="pg-sub">Best completion times across all players. Sign in to appear here.</p>

  <div class="auth-notice" id="auth-notice">
    ⚠ Sign in to see your row highlighted and submit your times.
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="lb-box" id="lb-box"><div class="lb-state loading">LOADING…</div></div>
  <div class="pag" id="pag"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script>
const ACCENTS={1:'#f97316',2:'#22c55e',3:'#f43f5e',4:'#06b6d4',5:'#a855f7',
               6:'#eab308',7:'#38bdf8',8:'#f97316',9:'#84cc16',10:'#818cf8'};
const NAMES={1:'Sunrise Steps',2:'Wall Rider',3:'Coral Caves',4:'Ocean Deep',5:'Neon District',
             6:'Golden Ruins',7:'Frozen Peaks',8:'Lava Flow',9:'Toxic Swamp',10:'Final Frontier'};

const PER=10;
let lvl=1, rows=[], page=1, uid=null;

function setAc(ac){document.documentElement.style.setProperty('--ac',ac)}
function fmt(s){return s==null?'—':s<60?s.toFixed(3)+'s':`${Math.floor(s/60)}m ${(s%60).toFixed(3)}s`}
function fmtDate(ts){if(!ts)return'';const d=new Date(ts);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'2-digit'})}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function rankHtml(i){
  if(i===0)return'<div class="rank g">🥇</div>';
  if(i===1)return'<div class="rank s">🥈</div>';
  if(i===2)return'<div class="rank b">🥉</div>';
  return`<div class="rank">#${i+1}</div>`;
}

function buildTabs(){
  const el=document.getElementById('tabs');
  el.innerHTML='';
  for(let i=1;i<=10;i++){
    const b=document.createElement('button');
    b.className='tab'+(i===lvl?' active':'');
    b.textContent=`${i}. ${NAMES[i]}`;
    b.onclick=()=>loadLvl(i);
    el.appendChild(b);
  }
}

function renderPage(){
  const box=document.getElementById('lb-box');
  if(!rows.length){
    box.innerHTML='<div class="lb-state">No times recorded yet — be the first!</div>';
    document.getElementById('pag').innerHTML='';
    return;
  }
  const start=(page-1)*PER;
  const slice=rows.slice(start,start+PER);
  let html=`<div class="lb-head">
    <div>Rank</div><div>Player</div>
    <div style="text-align:right">Time</div>
    <div style="text-align:right">Date</div>
  </div>`;
  slice.forEach((r,idx)=>{
    const gi=start+idx;
    const isMe=r.uid===uid;
    const av=r.photo?`<img class="avatar" src="${esc(r.photo)}" alt="" onerror="this.style.display='none'">`
                    :`<div class="avatar"></div>`;
    html+=`<div class="lb-row${isMe?' me':''}">
      ${rankHtml(gi)}
      <div class="player">${av}<span class="pname">${esc(r.name||'Anonymous')}${isMe?'<span class="you-tag">YOU</span>':''}</span></div>
      <div class="tcell">${fmt(r.t)}</div>
      <div class="dcell">${fmtDate(r.ts)}</div>
    </div>`;
  });
  box.innerHTML=html;
  renderPag();
}

function renderPag(){
  const total=Math.ceil(rows.length/PER);
  const el=document.getElementById('pag');
  if(total<=1){el.innerHTML='';return}
  el.innerHTML=`
    <button class="pg-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>← Prev</button>
    <span class="pg-info">Page ${page} / ${total} &nbsp;·&nbsp; ${rows.length} players</span>
    <button class="pg-btn" onclick="goPage(${page+1})" ${page===total?'disabled':''}>Next →</button>`;
}

function goPage(p){
  const total=Math.ceil(rows.length/PER);
  if(p<1||p>total)return;
  page=p;renderPage();
  window.scrollTo({top:0,behavior:'smooth'});
}

async function loadLvl(n){
  lvl=n;page=1;
  setAc(ACCENTS[n]);
  buildTabs();
  document.getElementById('lb-box').innerHTML='<div class="lb-state loading">LOADING…</div>';
  document.getElementById('pag').innerHTML='';
  try{
    rows=await window.FB.getLeaderboard(n);
    renderPage();
  }catch(e){
    document.getElementById('lb-box').innerHTML='<div class="lb-state">Failed to load. Check your connection.</div>';
  }
}

// Init
setAc(ACCENTS[1]);
buildTabs();
window.FB.onAuthChange(user=>{
  uid=user?user.uid:null;
  if(!user)document.getElementById('auth-notice').style.display='block';
  else document.getElementById('auth-notice').style.display='none';
  loadLvl(lvl);
});
</script>
</body>
</html>
