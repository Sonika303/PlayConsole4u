<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Little Traffic | 100 KMH Start</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Arial Black', sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            pointer-events: none; z-index: 10; text-shadow: 2px 2px #000;
        }
        .stat { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #ffcc00; }
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 100;
        }
        button { padding: 20px 40px; font-size: 25px; cursor: pointer; background: #ffcc00; color: #000; border: none; font-weight: bold; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat">DISTANCE: <span id="dist-val">0</span>m</div>
        <div class="stat">SPEED: <span id="speed-val">100</span> KM/H</div>
    </div>

    <div id="game-over">
        <h1 style="font-size: 70px; color: #ff3333; margin:0;">WASTED</h1>
        <p style="font-size: 28px;">YOU TRAVELLED <span id="final-dist">0</span> METERS</p>
        <button onclick="location.reload()">TRY AGAIN</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 60, 500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.set(0, 5, 25); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 1.6);
        sun.position.set(50, 120, 50);
        scene.add(sun, new THREE.AmbientLight(0xffffff, 0.5));

        // --- WORLD CONTAINER ---
        const worldContainer = new THREE.Group();
        scene.add(worldContainer);

        const grass = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), new THREE.MeshStandardMaterial({ color: 0x348C31 }));
        grass.rotation.x = -Math.PI / 2;
        scene.add(grass);

        const road = new THREE.Mesh(new THREE.PlaneGeometry(28, 5000), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.15;
        scene.add(road);

        // Pre-build scenery (Trees and Cranes)
        for(let i=0; i<150; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1, 6), new THREE.MeshStandardMaterial({ color: 0x5d2f00 }));
            const canopy = new THREE.Mesh(new THREE.ConeGeometry(5.5, 14, 8), new THREE.MeshStandardMaterial({ color: 0x013220 }));
            canopy.position.y = 7;
            tree.add(trunk, canopy);
            tree.position.set(Math.random() > 0.5 ? 35 + Math.random()*20 : -35 - Math.random()*20, 3, -i * 40);
            worldContainer.add(tree);
        }

        // --- MODELS ---
        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.3, 7), new THREE.MeshStandardMaterial({ color: 0x00f2ff, metalness: 0.9, roughness: 0.1 }));
        const pSpoil = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.3, 1.2), new THREE.MeshStandardMaterial({ color: 0x000000 }));
        pSpoil.position.set(0, 1.1, 3);
        player.add(pBody, pSpoil);
        player.position.set(0, 0.8, 12);
        scene.add(player);

        const traffic = [], hazards = [];

        function spawnNPC() {
            const npc = new THREE.Group();
            const nBody = new THREE.Mesh(new THREE.BoxGeometry(3.8, 1.6, 7.5), new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff }));
            const nGlass = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.8, 2), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            nGlass.position.set(0, 1, -1.5);
            npc.add(nBody, nGlass);
            npc.position.set((Math.floor(Math.random() * 3) - 1) * 9.5, 0.8, -600);
            scene.add(npc);
            traffic.push(npc);
        }

        function spawnPoolAndRamp(z) {
            const pool = new THREE.Mesh(new THREE.PlaneGeometry(28, 25), new THREE.MeshStandardMaterial({ color: 0x00aaff, transparent: true, opacity: 0.7 }));
            pool.rotation.x = -Math.PI / 2;
            pool.position.set(0, 0.2, z);
            scene.add(pool);
            hazards.push({ mesh: pool, type: 'water' });

            const ramp = new THREE.Mesh(new THREE.BoxGeometry(9, 4.5, 15), new THREE.MeshStandardMaterial({ color: 0xffcc00 }));
            ramp.rotation.x = -0.38;
            ramp.position.set((Math.random() - 0.5) * 15, 1.1, z + 25);
            scene.add(ramp);
            hazards.push({ mesh: ramp, type: 'ramp' });
        }

        // --- CORE LOGIC ---
        let distance = 0, currentSpeed = 100, moveX = 0, gameActive = true, airV = 0;

        window.onkeydown = e => { if(e.code==='KeyA') moveX=-0.4; if(e.code==='KeyD') moveX=0.4; };
        window.onkeyup = () => moveX = 0;

        function animate() {
            if(!gameActive) return;
            requestAnimationFrame(animate);

            // MATH: Start 100, +1 KM/H per 100 Distance
            currentSpeed = 100 + (distance / 100);
            let worldStep = currentSpeed * 0.018; // Velocity scaling
            
            distance += worldStep; 
            document.getElementById('dist-val').innerText = Math.floor(distance);
            document.getElementById('speed-val').innerText = Math.floor(currentSpeed);

            // Scenery Scroll
            worldContainer.position.z += worldStep;
            if(worldContainer.position.z > 400) worldContainer.position.z = 0;

            // Player Steering
            player.position.x += moveX * (worldStep * 0.4);
            player.position.x = Math.max(-12, Math.min(12, player.position.x));
            player.rotation.z = -moveX * 1.5;

            // Jumping Physics
            player.position.y += airV;
            if(player.position.y > 0.8) airV -= 0.03;
            else { player.position.y = 0.8; airV = 0; }

            // NPC Traffic (High Frequency)
            if(Math.random() < 0.06) spawnNPC();
            traffic.forEach((npc, i) => {
                npc.position.z += worldStep * 0.8; // Driving toward player
                
                const dx = Math.abs(player.position.x - npc.position.x);
                const dz = Math.abs(player.position.z - npc.position.z);
                if(dx < 3.2 && dz < 6.5 && player.position.y < 1.8) {
                    gameActive = false;
                    document.getElementById('game-over').style.display = 'flex';
                    document.getElementById('final-dist').innerText = Math.floor(distance);
                }
                if(npc.position.z > 100) { scene.remove(npc); traffic.splice(i,1); }
            });

            // Hazards (Pools/Ramps)
            if(Math.random() < 0.006) spawnPoolAndRamp(-800);
            hazards.forEach((h, i) => {
                h.mesh.position.z += worldStep;
                if(h.type === 'water') {
                    if(Math.abs(player.position.z - h.mesh.position.z) < 12 && player.position.y < 1.4) {
                        gameActive = false;
                        document.getElementById('game-over').style.display = 'flex';
                    }
                }
                if(h.type === 'ramp') {
                    if(Math.abs(player.position.x - h.mesh.position.x) < 5 && Math.abs(player.position.z - h.mesh.position.z) < 8) {
                        if(player.position.y < 3) airV = 0.7; // Catch big air
                    }
                }
                if(h.mesh.position.z > 100) { scene.remove(h.mesh); hazards.splice(i,1); }
            });

            camera.position.x = player.position.x * 0.6;
            camera.lookAt(player.position.x, 3.5, 0);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
