<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube Platformer</title>
<link rel="icon" type="image/png" href="../../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#08080f;color:#f0f0ff;overflow:hidden;height:100vh}

/* ── MENU ── */
#menu{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:30px;font-weight:900;letter-spacing:5px;color:#fff;margin-bottom:6px;text-shadow:0 0 30px rgba(255,255,255,.25)}
.subtitle{font-size:11px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.35);margin-bottom:28px;text-transform:uppercase}

/* ── LEVEL GRID ── */
.level-grid{display:grid;grid-template-columns:repeat(5,82px);gap:14px;margin-bottom:28px}

/* Each node gets its own color via inline style (--ac) */
.node{
  width:82px;height:82px;
  border:2px solid rgba(255,255,255,.12);
  border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;background:#111118;
  transition:transform .18s,border-color .18s,background .18s;
  will-change:transform;user-select:none;position:relative;
  padding:6px 4px;
}
.node-num{font-size:20px;font-weight:900;color:var(--ac,#fff);line-height:1}
.node-name{font-size:7px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.4);text-align:center;margin-top:3px;line-height:1.2}
.node-time{font-size:8px;font-weight:700;color:var(--ac,#fff);opacity:.8;margin-top:3px}
.node-icon{font-size:10px;margin-top:2px}

.node:hover:not(.locked){transform:translateY(-4px);border-color:var(--ac,#fff);background:#1a1a28}
.node.selected{
  border-color:var(--ac,#fff) !important;
  background:color-mix(in srgb,var(--ac,#333) 20%,#111118);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac,#333) 30%,transparent);
}
.node.selected::after{
  content:'';position:absolute;inset:-5px;border-radius:20px;
  border:2px solid var(--ac,#fff);opacity:.4;
  animation:pulse 2s ease infinite;pointer-events:none;
}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.1;transform:scale(1.06)}}
.node.locked{opacity:.18;cursor:not-allowed;pointer-events:none}
.node.done .node-icon{color:#f59e0b}

/* ── BUTTONS ── */
.play-btn{
  padding:14px 72px;
  background:linear-gradient(135deg,#4f46e5,#a855f7);
  color:#fff;border:none;font-family:'Nunito',sans-serif;
  font-size:15px;font-weight:900;letter-spacing:3px;
  border-radius:12px;cursor:pointer;transition:.2s;will-change:transform;
  box-shadow:0 0 24px rgba(168,85,247,.4);
}
.play-btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.play-btn:active{transform:translateY(0)}

.footer-links{display:flex;gap:20px;margin-top:18px;align-items:center}
.lnk{font-size:11px;font-weight:700;color:rgba(255,255,255,.3);text-decoration:none;letter-spacing:2px;transition:.2s}
.lnk:hover{color:rgba(255,255,255,.7)}

/* ── GAME ── */
#game-container{display:none;width:100%;height:100vh;position:relative;background:#08080f;align-items:center;justify-content:center}
#game-container.visible{display:flex}
canvas{display:block}
.back-btn{
  position:absolute;top:12px;left:12px;z-index:20;
  background:#111118;border:2px solid rgba(255,255,255,.15);
  color:#ccc;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;
  padding:8px 18px;border-radius:9px;cursor:pointer;transition:.2s;
}
.back-btn:hover{border-color:rgba(255,255,255,.4);color:#fff}
</style>
</head>
<body>
<div id="menu">
  <h1>CUBE PLATFORMER</h1>
  <div class="subtitle">Select a Level</div>
  <div class="level-grid" id="grid"></div>
  <button class="play-btn" onclick="startGame()">▶ &nbsp; PLAY</button>
  <div class="footer-links">
    <a class="lnk" href="../../index.html">← HOME</a>
    <a class="lnk" href="../../leaderboard.html">🏆 LEADERBOARD</a>
  </div>
</div>

<div id="game-container">
  <button class="back-btn" onclick="location.reload()">← BACK</button>
  <canvas id="gameCanvas"></canvas>
</div>

<!-- Firebase compat SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../../firebase.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>

<script>
// Level accent colors (match levels.js)
const ACCENTS={1:'#f97316',2:'#22c55e',3:'#f43f5e',4:'#06b6d4',5:'#a855f7',
               6:'#eab308',7:'#38bdf8',8:'#f97316',9:'#84cc16',10:'#818cf8'};
const NAMES={1:'Sunrise',2:'Wall Rider',3:'Coral',4:'Ocean',5:'Neon',
             6:'Golden',7:'Frozen',8:'Lava',9:'Swamp',10:'Frontier'};

if(!sessionStorage.getItem('cube_prog'))sessionStorage.setItem('cube_prog','1');
let current=1;
const grid=document.getElementById('grid');

function fmtTime(s){
  if(!s&&s!==0)return'';
  return s<60?s.toFixed(2)+'s':`${Math.floor(s/60)}m${(s%60).toFixed(0)}s`;
}

async function buildGrid(){
  const unlocked=parseInt(sessionStorage.getItem('cube_prog'));
  let bestTimes={};
  const u=window.FB?.currentUser();
  if(u){try{bestTimes=await window.FB.getBestTimes(u.uid)}catch(e){}}

  grid.innerHTML='';
  for(let i=1;i<=MAX_LEVELS;i++){
    const done=i<unlocked,locked=i>unlocked,sel=i===current;
    const ac=ACCENTS[i]||'#fff';
    const bt=bestTimes['level_'+i];
    const el=document.createElement('div');
    el.className='node'+(locked?' locked':'')+(sel?' selected':'')+(done?' done':'');
    el.style.setProperty('--ac',ac);
    el.id='n'+i;
    el.innerHTML=`
      <div class="node-num">${i}</div>
      <div class="node-name">${NAMES[i]||''}</div>
      ${bt?`<div class="node-time">⏱ ${fmtTime(bt)}</div>`:''}
      <div class="node-icon">${done?'★':locked?'🔒':'▶'}</div>`;
    if(!locked)el.onclick=()=>select(i);
    grid.appendChild(el);
  }
}

function select(n){
  if(n>parseInt(sessionStorage.getItem('cube_prog')))return;
  current=n;
  document.querySelectorAll('.node').forEach(e=>e.classList.remove('selected'));
  const el=document.getElementById('n'+n);
  el.classList.add('selected');
}

function startGame(){
  document.getElementById('menu').style.display='none';
  document.getElementById('game-container').classList.add('visible');
  initGame(current);
}

// Build grid; rebuild after auth resolves (to load best times)
buildGrid();
window.FB?.onAuthChange(()=>buildGrid());
</script>
</body>
</html>
