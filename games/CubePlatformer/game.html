<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube Platformer</title>
<link rel="icon" type="image/png" href="../../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#07070f;color:#f0f0ff;overflow:hidden;height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 50% 50% at 20% 55%,rgba(124,58,237,.1) 0%,transparent 60%),
             radial-gradient(ellipse 40% 50% at 80% 30%,rgba(167,139,250,.06) 0%,transparent 60%)}

#menu{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:28px;font-weight:900;letter-spacing:5px;color:#fff;margin-bottom:6px;text-shadow:0 0 24px rgba(255,255,255,.2)}
.sub{font-size:10px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.28);margin-bottom:28px;text-transform:uppercase}

/* LEVEL GRID */
.level-grid{display:grid;grid-template-columns:repeat(5,80px);gap:12px;margin-bottom:26px}
.node{
  width:80px;height:80px;
  border:2px solid rgba(255,255,255,.1);
  border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;background:#111118;
  transition:transform .18s,border-color .18s,background .18s;
  will-change:transform;user-select:none;position:relative;padding:4px;
}
.n-num{font-size:20px;font-weight:900;color:var(--ac,#fff);line-height:1}
.n-name{font-size:6.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.32);text-align:center;margin-top:2px;line-height:1.2}
.n-time{font-size:8px;font-weight:800;color:var(--ac,#aaa);margin-top:3px;opacity:.9}
.n-icon{font-size:10px;margin-top:2px;line-height:1}

.node:hover:not(.locked){transform:translateY(-4px);border-color:var(--ac,#fff);background:#1a1a26}
.node.sel{
  border-color:var(--ac,#fff) !important;
  background:rgba(255,255,255,.06);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac,#fff) 25%,transparent),
             0 8px 20px rgba(0,0,0,.4);
}
.node.sel::after{
  content:'';position:absolute;inset:-5px;border-radius:18px;
  border:2px solid var(--ac,#fff);opacity:.35;
  animation:ring 2s ease infinite;pointer-events:none;
}
@keyframes ring{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.1;transform:scale(1.06)}}
.node.locked{opacity:.15;cursor:not-allowed;pointer-events:none}
.node.done .n-icon{color:#f59e0b}
.node.done{border-color:rgba(255,255,255,.15);background:#0f1020}

/* PLAY BTN */
.play-btn{
  padding:14px 72px;
  background:linear-gradient(135deg,#7c3aed,#a78bfa);
  color:#fff;border:none;font-family:'Nunito',sans-serif;
  font-size:14px;font-weight:900;letter-spacing:3px;
  border-radius:11px;cursor:pointer;transition:.2s;will-change:transform;
  box-shadow:0 0 24px rgba(124,58,237,.45);
}
.play-btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
.play-btn:active{transform:translateY(0)}

.footer{display:flex;gap:20px;margin-top:16px}
.lnk{font-size:10px;font-weight:700;color:rgba(255,255,255,.25);text-decoration:none;letter-spacing:2px;transition:.2s}
.lnk:hover{color:rgba(255,255,255,.6)}

/* GAME */
#game-container{display:none;width:100%;height:100vh;position:relative;background:#07070f;align-items:center;justify-content:center}
#game-container.visible{display:flex}
canvas{display:block}
.back-btn{position:absolute;top:12px;left:12px;z-index:20;background:#111118;border:2px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;padding:7px 16px;border-radius:8px;cursor:pointer;transition:.2s}
.back-btn:hover{border-color:rgba(255,255,255,.3);color:#fff}
</style>
</head>
<body>
<div id="menu">
  <h1>CUBE PLATFORMER</h1>
  <div class="sub">Select a Level</div>
  <div class="level-grid" id="grid"></div>
  <button class="play-btn" onclick="startGame()">▶ &nbsp; PLAY</button>
  <div class="footer">
    <a class="lnk" href="../../index.html">← HOME</a>
    <a class="lnk" href="../../leaderboard.html">🏆 LEADERBOARD</a>
  </div>
</div>

<div id="game-container">
  <button class="back-btn" onclick="location.reload()">← BACK</button>
  <canvas id="gameCanvas"></canvas>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../../firebase.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
<script>
if(!sessionStorage.getItem('cube_prog'))sessionStorage.setItem('cube_prog','1');
let current=1;
const ACCENTS={1:'#f97316',2:'#22c55e',3:'#f43f5e',4:'#06b6d4',5:'#a855f7',
               6:'#eab308',7:'#38bdf8',8:'#f97316',9:'#84cc16',10:'#818cf8'};
const NAMES={1:'Sunrise',2:'Wall Rider',3:'Coral',4:'Ocean',5:'Neon',
             6:'Golden',7:'Frozen',8:'Lava',9:'Swamp',10:'Frontier'};

function fmt(s){return s==null?'':s<60?s.toFixed(2)+'s':`${Math.floor(s/60)}m${(s%60).toFixed(0)}s`}

async function buildGrid(){
  const u=parseInt(sessionStorage.getItem('cube_prog'));
  let times={};
  const user=window.FB?.currentUser();
  if(user){try{times=await window.FB.getMyTimes(user.uid);}catch(e){}}
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  for(let i=1;i<=MAX_LEVELS;i++){
    const done=i<u,locked=i>u,sel=i===current;
    const ac=ACCENTS[i];
    const entry=times['L'+i];
    const el=document.createElement('div');
    el.className='node'+(locked?' locked':'')+(sel?' sel':'')+(done?' done':'');
    el.style.setProperty('--ac',ac);
    el.id='n'+i;
    el.innerHTML=`
      <div class="n-num">${i}</div>
      <div class="n-name">${NAMES[i]}</div>
      ${entry?`<div class="n-time">⏱${fmt(entry.t)}</div>`:''}
      <div class="n-icon">${done?'★':locked?'🔒':'▶'}</div>`;
    if(!locked)el.onclick=()=>select(i);
    grid.appendChild(el);
  }
}
function select(n){
  if(n>parseInt(sessionStorage.getItem('cube_prog')))return;
  current=n;
  document.querySelectorAll('.node').forEach(e=>e.classList.remove('sel'));
  document.getElementById('n'+n).classList.add('sel');
}
function startGame(){
  document.getElementById('menu').style.display='none';
  document.getElementById('game-container').classList.add('visible');
  initGame(current);
}
buildGrid();
window.FB?.onAuthChange(()=>buildGrid());
</script>
</body>
</html>
